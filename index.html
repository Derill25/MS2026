:root{--bg:#f1f5f9;--card:#fff;--ink:#0f172a;--mut:#64748b;--acc:#15803d;--acc2:#1e3a5f;--bord:#e2e8f0;--gold:#ca8a04;--red:#dc2626}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
header{background:var(--acc2);color:#fff;padding:14px 16px 0;position:sticky;top:0;z-index:50}
header h1{font-size:18px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
#conn{font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;background:#475569;color:#cbd5e1}
#conn.on{background:#166534;color:#dcfce7}
nav{display:flex;gap:4px;overflow-x:auto}
nav button{background:transparent;border:none;color:#cbd5e1;padding:10px 14px;font-size:14px;cursor:pointer;border-radius:8px 8px 0 0;white-space:nowrap}
nav button.act{background:var(--bg);color:var(--ink);font-weight:600}
main{max-width:880px;margin:0 auto;padding:14px 10px 60px}
.card{background:var(--card);border:1px solid var(--bord);border-radius:10px;margin-bottom:10px;overflow:hidden}
.mhead{display:flex;align-items:center;gap:8px;padding:10px 12px;cursor:pointer;flex-wrap:wrap}
.mhead:hover{background:#f8fafc}
.badge{font-size:11px;font-weight:700;padding:2px 7px;border-radius:99px;background:#e2e8f0;color:#334155;white-space:nowrap}
.badge.ko{background:#fef3c7;color:#92400e}
.teams{font-weight:600;flex:1;min-width:180px}
.score{font-weight:700;color:var(--acc);white-space:nowrap}
.when{font-size:12px;color:var(--mut);white-space:nowrap}
.mbody{border-top:1px solid var(--bord);padding:12px}
.sect{font-size:12px;font-weight:700;text-transform:uppercase;color:var(--mut);margin:10px 0 6px}
.sect:first-child{margin-top:0}
input,select{border:1px solid #cbd5e1;border-radius:7px;padding:7px 9px;font-size:14px;background:#fff;color:var(--ink)}
input.g{width:46px;text-align:center}
input.sc{width:100%}
table{width:100%;border-collapse:collapse}
td,th{padding:6px 6px;text-align:left;border-bottom:1px solid var(--bord);font-size:14px;vertical-align:middle}
th{font-size:12px;color:var(--mut);text-transform:uppercase}
.pts{font-weight:700;color:var(--acc);white-space:nowrap}
.pts.zero{color:#94a3b8}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{background:var(--acc);color:#fff;border:none;border-radius:8px;padding:9px 14px;font-size:14px;font-weight:600;cursor:pointer}
.btn.sec{background:#e2e8f0;color:var(--ink)}
.btn.danger{background:var(--red)}
.btn.sm{padding:5px 10px;font-size:13px}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
.chip{border:1px solid #cbd5e1;background:#fff;border-radius:99px;padding:6px 13px;font-size:13px;cursor:pointer;white-space:nowrap}
.chip.act{background:var(--acc2);color:#fff;border-color:var(--acc2)}
.dateh{font-size:13px;font-weight:700;color:var(--acc2);margin:16px 4px 8px;text-transform:capitalize}
.note{font-size:13px;color:var(--mut);margin:8px 0}
.box{background:var(--card);border:1px solid var(--bord);border-radius:10px;padding:14px;margin-bottom:12px}
h2{font-size:16px;margin-bottom:10px}
.rank1{background:#fef9c3}
.search{width:100%;margin-bottom:10px}
.del{background:none;border:none;color:var(--red);cursor:pointer;font-size:16px}
.muted{color:var(--mut);font-size:13px}
@media(max-width:560px){td,th{padding:5px 3px;font-size:13px}input.g{width:38px}}

// ---------- STAV (synchronizovaný z Firebase) ----------
let S={players:[],koTeams:{},results:{},tips:{},tour:{tips:{},winner:'',scorers:''}},READY=false,PENDING=false;
function fromSnap(d){
  d=d||{};
  const pl=Object.entries(d.players||{}).map(([k,v])=>({k,n:(v&&v.n)||k,t:(v&&v.t)||0})).sort((a,b)=>a.t-b.t);
  S={players:pl,koTeams:d.koTeams||{},results:d.results||{},tips:d.tips||{},
     tour:{tips:(d.tour&&d.tour.tips)||{},winner:(d.tour&&d.tour.winner)||'',scorers:(d.tour&&d.tour.scorers)||''}};
}
ROOT.on('value',snap=>{
  fromSnap(snap.val());READY=true;
  const ae=document.activeElement;
  if(ae&&ae.tagName==='INPUT'&&document.getElementById('app').contains(ae)){PENDING=true}
  else render();
});
document.addEventListener('focusout',()=>{if(PENDING){PENDING=false;setTimeout(render,50)}});

// ---------- POMOCNÉ ----------
const norm=s=>(s||'').trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const esc=s=>(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pkey=n=>n.trim().replace(/[.#$/\[\]]/g,'_');
const pname=k=>{const p=S.players.find(x=>x.k===k);return p?p.n:k};
function teamsOf(m){if(m[1]==="G")return[m[4],m[5]];const t=S.koTeams[m[0]]||{};return[t.h||'',t.a||'']}
function scorerHit(tip,scorers){
  const t=norm(tip);if(!t)return false;
  return scorers.split(',').map(norm).filter(Boolean).some(s=>s===t||s.includes(t)||t.includes(s));
}
// Bodovanie: presný výsledok 3 b (inak správny víťaz/remíza 1 b) + strelec v zápase 2 b
function matchPts(mid,k){
  const r=S.results[mid];
  if(!r||r.h===''||r.h==null||r.a===''||r.a==null)return null;
  const tp=(S.tips[mid]||{})[k];
  const d={w:0,e:0,s:0,p:0};
  if(tp&&tp.h!==''&&tp.h!=null&&tp.a!==''&&tp.a!=null){
    const th=+tp.h,ta=+tp.a,rh=+r.h,ra=+r.a;
    if(th===rh&&ta===ra){d.e=1;d.p+=3}
    else if(Math.sign(th-ta)===Math.sign(rh-ra)){d.w=1;d.p+=1}
  }
  if(tp&&tp.s&&r.sc&&scorerHit(tp.s,r.sc)){d.s=1;d.p+=2}
  return d;
}
function totals(k){
  const t={matches:0,w:0,e:0,s:0,bw:0,bs:0,total:0};
  for(const m of M){const d=matchPts(m[0],k);if(d){t.matches+=d.p;t.w+=d.w;t.e+=d.e;t.s+=d.s}}
  const tt=S.tour.tips[k]||{};
  if(S.tour.winner&&tt.winner&&norm(tt.winner)===norm(S.tour.winner))t.bw=10;
  if(S.tour.scorers&&tt.scorer&&scorerHit(tt.scorer,S.tour.scorers))t.bs=8;
  t.total=t.matches+t.bw+t.bs;
  return t;
}
function fmtDate(iso){const d=new Date(iso);return d.toLocaleDateString('sk-SK',{weekday:'long',day:'numeric',month:'numeric'})}
function fmtTime(iso){const d=new Date(iso);return d.toLocaleTimeString('sk-SK',{hour:'2-digit',minute:'2-digit'})}

const TABS=[['matches','Zápasy'],['tour','Turnaj'],['board','Rebríček'],['players','Hráči'],['data','Dáta']];
const $=id=>document.getElementById(id);

function renderNav(){
  $('nav').innerHTML=TABS.map(([k,l])=>`<button class="${TAB===k?'act':''}" onclick="setTab('${k}')">${l}</button>`).join('');
}
function setTab(t){TAB=t;render()}
function setFilter(f){FILTER=f;render()}
function render(){
  renderNav();
  if(!READY)return;
  const app=$('app');
  if(TAB==='matches')app.innerHTML=vMatches();
  else if(TAB==='tour')app.innerHTML=vTour();
  else if(TAB==='board')app.innerHTML=vBoard();

// ---- Zápasy ----
function vMatches(){
  if(!S.players.length)return `<div class="box"><h2>Najprv pridaj hráčov</h2><p class="note">Prejdi na záložku <b>Hráči</b> a pridaj tipujúcich.</p></div>`;
  const now=Date.now();
  let list=M.filter(m=>{
    if(FILTER==='today'){const d=new Date(m[3]),n=new Date();if(d.toDateString()!==n.toDateString())return false}
    if(FILTER==='upcoming'&&new Date(m[3]).getTime()<now-5*3600e3&&S.results[m[0]])return false;
    if(FILTER==='noresult'&&S.results[m[0]])return false;
    if(FILTER==='ko'&&m[1]==='G')return false;
    if(Q){const[h,a]=teamsOf(m);const q=norm(Q);if(!norm(h).includes(q)&&!norm(a).includes(q)&&!norm(m[6]).includes(q))return false}
    return true;
  });
  const chips=[['upcoming','Aktuálne'],['today','Dnes'],['noresult','Bez výsledku'],['ko','Playoff'],['all','Všetky']]
    .map(([k,l])=>`<button class="chip ${FILTER===k?'act':''}" onclick="setFilter('${k}')">${l}</button>`).join('');
  let html=`<input class="search" placeholder="Hľadať tím alebo mesto…" value="${esc(Q)}" onchange="Q=this.value;render()">`+
    `<div class="chips">${chips}</div>`;
  if(!list.length)html+=`<p class="note">Žiadne zápasy pre tento filter.</p>`;
  let lastDay='';
  for(const m of list){
    const day=fmtDate(m[3]);
    if(day!==lastDay){html+=`<div class="dateh">${day}</div>`;lastDay=day}
    html+=vMatchCard(m);
  }
  return html;
}
function vMatchCard(m){
  const id=m[0],[h,a]=teamsOf(m),r=S.results[id],open=OPEN.has(id);
  const badge=m[1]==='G'?`<span class="badge">Sk. ${m[2]}</span>`:`<span class="badge ko">${STAGE[m[1]]}</span>`;
  const hn=h||'<i style="color:#94a3b8">doplniť</i>',an=a||'<i style="color:#94a3b8">doplniť</i>';
  const score=r&&r.h!==''&&r.h!=null?`<span class="score">${r.h}:${r.a}</span>`:`<span class="when">${fmtTime(m[3])}</span>`;
  const tipCnt=Object.values(S.tips[id]||{}).filter(t=>t&&t.h!==''&&t.h!=null).length;
  let html=`<div class="card"><div class="mhead" onclick="toggle(${id})">${badge}<span class="teams">${hn} – ${an}</span>${score}<span class="when">${m[6]} · ${tipCnt}/${S.players.length} tipov</span></div>`;
  if(open){
    html+=`<div class="mbody">`;
    if(m[1]!=='G'){
      html+=`<div class="sect">Tímy (doplň po žrebe/postupe)</div><div class="row">
        <input style="flex:1" placeholder="Domáci" value="${esc(h)}" onchange="setKoTeam(${id},'h',this.value)">
        <input style="flex:1" placeholder="Hostia" value="${esc(a)}" onchange="setKoTeam(${id},'a',this.value)"></div>`;
    }
    html+=`<div class="sect">Výsledok zápasu</div><div class="row">
      <input class="g" type="number" min="0" placeholder="–" value="${r?esc(String(r.h??'')):''}" onchange="setRes(${id},'h',this.value)"> :
      <input class="g" type="number" min="0" placeholder="–" value="${r?esc(String(r.a??'')):''}" onchange="setRes(${id},'a',this.value)">
      <input style="flex:1;min-width:160px" placeholder="Strelci gólov (oddeliť čiarkou)" value="${r?esc(r.sc||''):''}" onchange="setRes(${id},'sc',this.value)">
      ${r?`<button class="btn sec sm" onclick="clearRes(${id})">Vymazať</button>`:''}</div>
      <div class="sect">Tipy hráčov</div>
      <table><tr><th>Hráč</th><th>Tip</th><th>Strelec</th><th>Body</th></tr>`;
    for(const p of S.players){
      const tp=(S.tips[id]||{})[p.k]||{},d=matchPts(id,p.k);
      const pts=d==null?'<span class="muted">–</span>':`<span class="pts ${d.p?'':'zero'}">${d.p} b${d.p?` (${[d.e?'presný':'',d.w?'víťaz':'',d.s?'strelec':''].filter(Boolean).join('+')})`:''}</span>`;
      html+=`<tr><td><b>${esc(p.n)}</b></td>
        <td style="white-space:nowrap"><input class="g" type="number" min="0" placeholder="–" value="${tp.h??''}" onchange="setTip(${id},'${esc(p.k)}','h',this.value)"> : <input class="g" type="number" min="0" placeholder="–" value="${tp.a??''}" onchange="setTip(${id},'${esc(p.k)}','a',this.value)"></td>
        <td><input class="sc" placeholder="strelec" value="${esc(tp.s||'')}" onchange="setTip(${id},'${esc(p.k)}','s',this.value)"></td>
        <td>${pts}</td></tr>`;
    }
    html+=`</table></div>`;
  }
  return html+`</div>`;
}
function toggle(id){OPEN.has(id)?OPEN.delete(id):OPEN.add(id);render()}
function setKoTeam(id,f,v){ROOT.child(`koTeams/${id}/${f}`).set(v.trim())}
function setRes(id,k,v){
  const r=S.results[id]||{h:'',a:'',sc:''};
  r[k]=k==='sc'?v:(v===''?'':+v);
  ROOT.child(`results/${id}`).set(r);
}
function clearRes(id){if(confirm('Vymazať výsledok zápasu?'))ROOT.child(`results/${id}`).remove()}
function setTip(id,pk,k,v){
  const t=(S.tips[id]||{})[pk]||{h:'',a:'',s:''};
  t[k]=k==='s'?v:(v===''?'':+v);
  ROOT.child(`tips/${id}/${pk}`).set(t);
}

// ---- Turnaj ----
function vTour(){
  if(!S.players.length)return `<div class="box"><h2>Najprv pridaj hráčov</h2><p class="note">Prejdi na záložku <b>Hráči</b>.</p></div>`;
  const opts=sel=>`<option value="">–</option>`+TEAMS.map(t=>`<option ${t===sel?'selected':''}>${t}</option>`).join('');
  let html=`<div class="box"><h2>Tipy pred turnajom</h2>
    <p class="note">Celkový víťaz = <b>10 bodov</b>, najlepší strelec turnaja = <b>8 bodov</b>.</p>
    <table><tr><th>Hráč</th><th>Majster sveta</th><th>Najlepší strelec</th><th>Body</th></tr>`;
  for(const p of S.players){
    const tt=S.tour.tips[p.k]||{},t=totals(p.k);
    const b=(t.bw?`+10`:'')+(t.bs?` +8`:'');
    html+=`<tr><td><b>${esc(p.n)}</b></td>
      <td><select onchange="setTour('${esc(p.k)}','winner',this.value)">${opts(tt.winner||'')}</select></td>
      <td><input placeholder="meno hráča" value="${esc(tt.scorer||'')}" onchange="setTour('${esc(p.k)}','scorer',this.value)"></td>
      <td class="pts">${b||'<span class="muted">–</span>'}</td></tr>`;
  }
  html+=`</table></div>
  <div class="box"><h2>Skutočný výsledok turnaja (vyplniť na konci)</h2>
    <div class="row" style="margin-bottom:8px"><label style="min-width:130px">Majster sveta:</label>
    <select onchange="setTourWinner(this.value)">${opts(S.tour.winner)}</select></div>
    <div class="row"><label style="min-width:130px">Najlepší strelci:</label>
    <input style="flex:1" placeholder="mená oddelené čiarkou (ak ich je viac)" value="${esc(S.tour.scorers)}" onchange="setTourScorers(this.value)"></div></div>`;
  return html;
}
function setTour(pk,k,v){ROOT.child(`tour/tips/${pk}/${k}`).set(v)}
function setTourWinner(v){ROOT.child('tour/winner').set(v)}
function setTourScorers(v){ROOT.child('tour/scorers').set(v)}

// ---- Rebríček ----
function vBoard(){
  if(!S.players.length)return `<div class="box"><h2>Žiadni hráči</h2></div>`;
  const rows=S.players.map(p=>({n:p.n,...totals(p.k)})).sort((a,b)=>b.total-a.total);
  let html=`<div class="box"><h2>🏆 Rebríček</h2>
    <table><tr><th>#</th><th>Hráč</th><th>Víťaz<br>(1 b)</th><th>Presný<br>(3 b)</th><th>Strelec<br>(2 b)</th><th>Bonus</th><th>Spolu</th></tr>`;
  rows.forEach((r,i)=>{
    html+=`<tr class="${i===0&&r.total>0?'rank1':''}"><td>${i+1}.</td><td><b>${esc(r.n)}</b></td>
      <td>${r.w}×</td><td>${r.e}×</td><td>${r.s}×</td><td>${r.bw+r.bs||0}</td><td class="pts">${r.total}</td></tr>`;
  });
  html+=`</table><p class="note">Presný výsledok = 3 b (víťaz sa už nepočíta). Správny víťaz/remíza = 1 b. Strelec v zápase = 2 b (počíta sa nezávisle, max 5 b za zápas).</p></div>`;
  return html;
}

// ---- Hráči ----
function vPlayers(){
  let html=`<div class="box"><h2>Hráči</h2>
    <div class="row" style="margin-bottom:12px"><input id="np" style="flex:1" placeholder="Meno nového hráča">
    <button class="btn" onclick="addPlayer()">Pridať</button></div>`;
  if(!S.players.length)html+=`<p class="note">Zatiaľ žiadni hráči.</p>`;
  else{
    html+=`<table>`;
    for(const p of S.players)html+=`<tr><td><b>${esc(p.n)}</b></td><td style="text-align:right"><button class="del" onclick="delPlayer('${esc(p.k)}')">✕ odstrániť</button></td></tr>`;
    html+=`</table>`;
  }
  return html+`</div>`;
}
function addPlayer(){
  const v=$('np').value.trim();
  if(!v)return;
  const k=pkey(v);
  if(S.players.some(p=>norm(p.n)===norm(v)||p.k===k)){alert('Hráč s týmto menom už existuje.');return}
  ROOT.child(`players/${k}`).set({n:v,t:Date.now()});
}
function delPlayer(k){
  if(!confirm('Odstrániť hráča „'+pname(k)+'" aj so všetkými jeho tipmi?'))return;
  const upd={};
  upd[`players/${k}`]=null;
  upd[`tour/tips/${k}`]=null;
  for(const m of M)upd[`tips/${m[0]}/${k}`]=null;
  ROOT.update(upd);
}

// ---- Dáta ----
function vData(){
  const n=Object.keys(S.results).length;
  return `<div class="box"><h2>Zdieľané dáta</h2>
    <p class="note">Dáta sú uložené online (Firebase) a aktualizujú sa všetkým okamžite. Každý s adresou stránky môže zapisovať — funguje to na dôvere v partii.</p>
    <div class="row"><button class="btn" onclick="expData()">⬇ Stiahnuť zálohu (JSON)</button>
    <label class="btn sec" style="cursor:pointer">⬆ Obnoviť zo zálohy<input type="file" accept=".json" style="display:none" onchange="impData(this)"></label></div>
    <p class="note">${S.players.length} hráčov · ${n} zápasov s výsledkom</p></div>
    <div class="box"><h2>Pravidlá bodovania</h2>
    <p class="note">• Správny víťaz zápasu (alebo remíza): <b>1 bod</b><br>
    • Presný výsledok: <b>3 body</b> (nahrádza bod za víťaza)<br>
    • Uhádnutý strelec v zápase: <b>2 body</b> (nezávisle od výsledku)<br>
    • Celkový víťaz turnaja: <b>10 bodov</b> · Najlepší strelec turnaja: <b>8 bodov</b><br>
    • Tipy sa zadávajú vždy pred zápasom. Pri playoff sa počíta výsledok tak, ako ho zapíše zapisovateľ (dohodnite sa, či po predĺžení/penaltách).</p></div>
    <div class="box"><h2>Nebezpečná zóna</h2>
    <button class="btn danger" onclick="wipe()">Vymazať všetky dáta</button></div>`;
}
function expData(){
  ROOT.get().then(snap=>{
    const blob=new Blob([JSON.stringify(snap.val()||{},null,1)],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='ms2026-tipovacka-zaloha-'+new Date().toISOString().slice(0,10)+'.json';
    a.click();
  });
}
function impData(inp){
  const f=inp.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const d=JSON.parse(rd.result);
      if(typeof d!=='object'||d===null)throw 0;
      if(confirm('Nahradiť VŠETKY online dáta touto zálohou? Zmení sa to všetkým hráčom.'))ROOT.set(d);
    }catch(e){alert('Neplatný súbor zálohy.')}
  };
  rd.readAsText(f);
}
function wipe(){
  if(confirm('Naozaj vymazať VŠETKY dáta (hráčov, tipy aj výsledky)? Zmaže sa to všetkým!')&&confirm('Posledné varovanie – dáta sa nedajú obnoviť. Pokračovať?'))ROOT.remove();
}
window.setTab=setTab;window.setFilter=setFilter;window.toggle=toggle;window.setKoTeam=setKoTeam;window.setRes=setRes;window.clearRes=clearRes;window.setTip=setTip;window.setTour=setTour;window.setTourWinner=setTourWinner;window.setTourScorers=setTourScorers;window.addPlayer=addPlayer;window.delPlayer=delPlayer;window.expData=expData;window.impData=impData;window.wipe=wipe;
renderNav();
</script>
</body>
</html>
